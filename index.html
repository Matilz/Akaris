    <!-- Modern Clean Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;900&family=Playfair+Display:ital,wght@0,700;1,500;1,700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: #040108;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Ambient Grid Background */
        .bg-grid { }
        #gridLayer {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image: radial-gradient(rgba(168, 85, 247, 0.12) 1px, transparent 0);
            background-size: 32px 32px;
        }

        /* Toast Floating Notification */
        #toastBanner {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100;
            transform: translateX(120%);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            opacity: 0;
        }
        #toastBanner.show {
            transform: translateX(0);
            opacity: 1;
        }

        /* Fullscreen 3D Canvas */
        #interactiveCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            display: block;
        }

        /* Premium Glass Container */
        .glass-card-premium {
            background: linear-gradient(145deg, rgba(22, 9, 36, 0.82) 0%, rgba(10, 4, 18, 0.94) 100%);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(192, 132, 252, 0.25);
            box-shadow: 
                0 0 50px rgba(147, 51, 234, 0.22),
                inset 0 1px 1px rgba(255, 255, 255, 0.22),
                inset 0 -1px 20px rgba(126, 34, 206, 0.12);
            transform-style: preserve-3d;
            will-change: transform;
        }

        .glass-card-premium:hover {
            border-color: rgba(216, 180, 254, 0.45);
            box-shadow: 
                0 0 75px rgba(168, 85, 247, 0.38),
                inset 0 1px 2px rgba(255, 255, 255, 0.35),
                inset 0 -1px 30px rgba(147, 51, 234, 0.22);
        }

        /* Dynamic Border Glow Sweep */
        .glow-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(216, 180, 254, 0.85) 50%, transparent 100%);
            animation: sweep 4.5s infinite ease-in-out;
        }

        @keyframes sweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Tab Navigation Button Styles */
        .tab-btn {
            position: relative;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.35) 0%, rgba(126, 34, 206, 0.22) 100%);
            border-color: rgba(216, 180, 254, 0.55);
            color: #ffffff;
            box-shadow: 0 0 24px rgba(168, 85, 247, 0.42), inset 0 0 12px rgba(192, 132, 252, 0.25);
            text-shadow: 0 0 10px rgba(233, 213, 255, 0.7);
        }

        /* Bottom Nav Button */
        .bottom-nav-btn {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.3) 0%, rgba(88, 28, 135, 0.4) 100%);
            border: 1px solid rgba(192, 132, 252, 0.4);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }
        .bottom-nav-btn:hover, .bottom-nav-btn.active {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.5) 0%, rgba(126, 34, 206, 0.6) 100%);
            border-color: rgba(233, 213, 255, 0.7);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.4);
        }

        /* 3D Tilt Elements */
        .tilt-btn {
            transform-style: preserve-3d;
            will-change: transform;
        }

        .btn-purple-glow {
            background: linear-gradient(135deg, #9333ea 0%, #6b21a8 100%);
            box-shadow: 0 0 30px rgba(147, 51, 234, 0.42), inset 0 1px 1px rgba(255, 255, 255, 0.35);
        }
        .btn-purple-glow:hover {
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.75), inset 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        .btn-youtube {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.35);
        }
        .btn-youtube:hover {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.72), inset 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        .btn-emerald {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.48), inset 0 1px 1px rgba(255, 255, 255, 0.35);
        }
        .btn-emerald:hover {
            background: linear-gradient(135deg, #10b981 0%, #065f46 100%);
            box-shadow: 0 0 55px rgba(16, 185, 129, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        /* ===== Premium Join Game Button ===== */
        .join-wrap {
            position: relative;
            transform: translateZ(35px);
        }
        .join-aura {
            position: absolute;
            inset: -3px;
            border-radius: 20px;
            background: conic-gradient(from var(--join-angle, 0deg), #7e22ce, #e879f9, #38bdf8, #a855f7, #7e22ce);
            filter: blur(14px);
            opacity: 0.45;
            animation: joinSpin 6s linear infinite;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .join-wrap:hover .join-aura { opacity: 0.85; }

        @property --join-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        @keyframes joinSpin {
            to { --join-angle: 360deg; }
        }

        .join-btn {
            position: relative;
            width: 100%;
            overflow: hidden;
            isolation: isolate;
            color: #fff;
            border: 1px solid rgba(233, 213, 255, 0.45);
            border-radius: 18px;
            padding: 16px 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            background:
                linear-gradient(135deg, rgba(168, 85, 247, 0.95) 0%, rgba(109, 40, 217, 0.95) 45%, rgba(67, 20, 130, 0.98) 100%);
            box-shadow:
                0 10px 30px -8px rgba(147, 51, 234, 0.7),
                inset 0 1px 1px rgba(255, 255, 255, 0.5),
                inset 0 -8px 18px rgba(46, 16, 101, 0.55);
            text-shadow: 0 0 14px rgba(243, 232, 255, 0.65);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.45s ease, filter 0.45s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .join-btn::before {
            content: "";
            position: absolute;
            top: 0; left: -60%;
            width: 40%; height: 100%;
            background: linear-gradient(105deg, transparent 0%, rgba(255, 255, 255, 0.45) 50%, transparent 100%);
            transform: skewX(-20deg);
            transition: left 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: -1;
        }
        .join-btn:hover::before { left: 130%; }
        .join-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, 0.28), transparent 55%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }
        .join-btn:hover::after { opacity: 1; }
        .join-btn:hover {
            transform: translateY(-3px) scale(1.015);
            filter: brightness(1.1) saturate(1.1);
            box-shadow:
                0 18px 44px -8px rgba(168, 85, 247, 0.9),
                inset 0 1px 2px rgba(255, 255, 255, 0.65),
                inset 0 -8px 18px rgba(46, 16, 101, 0.4);
        }
        .join-btn:active {
            transform: translateY(0) scale(0.975);
            transition-duration: 0.12s;
        }
        .join-btn:focus-visible {
            outline: 2px solid #e9d5ff;
            outline-offset: 3px;
        }
        .join-btn[disabled] {
            cursor: progress;
            filter: brightness(0.9);
        }

        .join-icon {
            width: 20px; height: 20px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.6));
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .join-btn:hover .join-icon { transform: scale(1.18) rotate(-6deg); }
        .join-arrow {
            width: 18px; height: 18px;
            opacity: 0;
            margin-left: -22px;
            transform: translateX(-8px);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, margin 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .join-btn:hover .join-arrow {
            opacity: 1;
            margin-left: 0;
            transform: translateX(0);
        }

        .join-spinner {
            display: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            animation: joinSpinLoader 0.7s linear infinite;
        }
        .join-btn.loading .join-spinner { display: block; }
        .join-btn.loading .join-icon,
        .join-btn.loading .join-arrow { display: none; }
        @keyframes joinSpinLoader { to { transform: rotate(360deg); } }

        .join-ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
            transform: scale(0);
            animation: joinRipple 0.7s ease-out forwards;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes joinRipple {
            to { transform: scale(4); opacity: 0; }
        }

        .join-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.16em;
            color: rgba(192, 132, 252, 0.7);
            text-transform: uppercase;
        }
        .join-meta i {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
            animation: statusPulse 2.2s infinite ease-in-out;
        }


        .join-wrap.sm { transform: none; flex-shrink: 0; }
        .join-wrap.sm .join-aura { inset: -2px; border-radius: 15px; filter: blur(9px); opacity: 0.4; }
        .join-btn.sm {
            width: auto;
            padding: 10px 16px;
            border-radius: 13px;
            font-size: 10px;
            letter-spacing: 0.16em;
            gap: 8px;
        }
        .join-btn.sm .join-icon { width: 14px; height: 14px; }
        .join-btn.sm .join-spinner { width: 14px; height: 14px; border-width: 2px; }
        .join-btn.sm:hover { transform: translateY(-2px) scale(1.04); }


        /* Support Map + Sign In joined as one tab pair */
        #tabSupportBtn { border-radius: 999px 0 0 999px; position: relative; }
        #signinBtn { border-radius: 0 999px 999px 0; margin-left: -1px; max-width: 160px; }
        #themeBtn { border-radius: 0; }
        #productBtn { border-radius: 999px 0 0 999px; }
        #executorBtn { border-radius: 0; margin-left: -1px; }
        #universalBtn { border-radius: 16px; padding-left: 22px; padding-right: 22px; }
        #universalModal .sc-title { font-size: 2.1rem; }
        #universalModal .sc-desc { font-size: 14px; }
        #universalModal .sc-icon { width: 58px; height: 58px; } #universalModal .sc-icon svg { width: 28px; height: 28px; }
        .uni-card { display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 24px; background: rgba(0,0,0,0.38); border: 1px solid rgba(168,85,247,0.3); box-shadow: inset 0 1px 1px rgba(255,255,255,0.08); }
        .uni-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .uni-head-left { display: flex; align-items: center; gap: 14px; min-width: 0; }

        /* ===== Map search bar (Select Script page) ===== */
        .uni-search { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
        .uni-search-row { display: flex; align-items: center; gap: 0; border-radius: 16px; background: rgba(8,4,22,.72); border: 1px solid rgba(216,180,254,.4); box-shadow: inset 0 1px 1px rgba(255,255,255,.08), 0 0 22px rgba(124,58,237,.18); overflow: hidden; transition: border-color .2s, box-shadow .2s; }
        .uni-search-row:focus-within { border-color: #c084fc; box-shadow: inset 0 1px 1px rgba(255,255,255,.1), 0 0 0 3px rgba(168,85,247,.28), 0 0 28px rgba(168,85,247,.35); }
        .uni-search-ico { flex: 0 0 auto; margin: 0 10px 0 16px; color: #a78bfa; display: flex; }
        .uni-search-in { flex: 1 1 auto; min-width: 0; background: transparent; border: 0; outline: 0; color: #f3e8ff; font: 600 14px 'Plus Jakarta Sans', sans-serif; padding: 15px 8px 15px 0; }
        .uni-search-in::placeholder { color: rgba(196,181,253,.5); }
        .uni-search-clear { flex: 0 0 auto; display: none; border: 0; background: transparent; color: #c4b5fd; font-size: 20px; line-height: 1; padding: 0 12px; cursor: pointer; }
        .uni-search-clear.show { display: block; }
        .uni-search-go { flex: 0 0 auto; align-self: stretch; border: 0; cursor: pointer; padding: 0 20px; font: 800 13px 'Plus Jakarta Sans', sans-serif; color: #1a0b2e; background: linear-gradient(180deg, #d8b4fe, #a78bfa); }
        .uni-search-go:hover { filter: brightness(1.08); }
        .uni-strict { display: inline-flex; align-items: center; gap: 10px; width: fit-content; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
        .uni-strict input { position: absolute; opacity: 0; pointer-events: none; }
        .uni-strict-sw { position: relative; width: 38px; height: 22px; border-radius: 999px; background: rgba(88,28,135,.55); border: 1px solid rgba(216,180,254,.35); transition: background .2s; }
        .uni-strict-sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #e9d5ff; transition: transform .2s; }
        .uni-strict input:checked + .uni-strict-sw { background: linear-gradient(90deg, #7e22ce, #a855f7); }
        .uni-strict input:checked + .uni-strict-sw::after { transform: translateX(16px); background: #fff; }
        .uni-strict input:focus-visible + .uni-strict-sw { outline: 2px solid #c084fc; outline-offset: 2px; }
        .uni-strict-txt { display: flex; flex-direction: column; line-height: 1.15; font: 800 12px 'Plus Jakarta Sans', sans-serif; color: #e9d5ff; }
        .uni-strict-txt small { font-weight: 600; font-size: 10px; color: rgba(196,181,253,.6); }
        .uni-count { font: 700 11px 'Plus Jakarta Sans', sans-serif; letter-spacing: .06em; color: rgba(196,181,253,.7); }
        .uni-empty { padding: 26px 16px; text-align: center; border-radius: 18px; border: 1px dashed rgba(216,180,254,.3); color: rgba(216,180,254,.75); font: 700 13px 'Plus Jakarta Sans', sans-serif; }
        @media (max-width: 520px) { .uni-search-go { padding: 0 14px; } }
        .uni-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
        .uni-map { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 22px; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent;
            background: rgba(0,0,0,0.38); border: 1px solid rgba(168,85,247,0.32); box-shadow: inset 0 1px 1px rgba(255,255,255,0.08); transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; }
        .uni-map:hover, .uni-map:focus-visible { transform: translateY(-4px); border-color: rgba(233,213,255,0.7); box-shadow: 0 0 28px rgba(168,85,247,0.5), inset 0 1px 1px rgba(255,255,255,0.18); outline: none; }
        .uni-pic { position: relative; width: 100%; aspect-ratio: 1; border-radius: 16px; overflow: hidden; display: grid; place-items: center;
            background: linear-gradient(145deg, #4c1d95, #1e1035); border: 1px solid rgba(192,132,252,0.45); box-shadow: 0 0 16px rgba(168,85,247,0.35); }
        .uni-pic-sm { width: 64px; flex-shrink: 0; border-radius: 14px; }
        .uni-ico { position: absolute; top: 8px; left: 8px; z-index: 3; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 12px; line-height: 1; background: rgba(10,4,24,.72); border: 1px solid rgba(216,180,254,.45); box-shadow: 0 0 14px rgba(168,85,247,.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
        .uni-pic-lg .uni-ico { width: 44px; height: 44px; top: 12px; left: 12px; border-radius: 14px; }
        .uni-fb.uni-fb-svg { display: flex; color: #e9d5ff; filter: drop-shadow(0 0 14px rgba(168,85,247,.75)); }
        .uni-fb.uni-fb-svg svg { width: 72px; height: 72px; stroke-width: 1.5; }
        .uni-pic-lg .uni-fb.uni-fb-svg svg { width: 112px; height: 112px; }
        .uni-ico { color: #e9d5ff; }
